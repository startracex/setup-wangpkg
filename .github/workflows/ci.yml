name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup wangpkg (explicit version)
        id: setup
        uses: ./
        with:
          version: 0.1.0

      - name: Verify binary
        shell: bash
        run: |
          wangpkg --version
          test -n "${{ steps.setup.outputs.version }}"
          test -n "${{ steps.setup.outputs.path }}"

      - name: Setup wangpkg from manifest
        uses: ./
        with:
          manifest: fixtures/package.json

      - name: Verify inferred version
        shell: bash
        run: wangpkg --version
